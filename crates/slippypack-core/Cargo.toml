[package]
name = "slippypack-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared library for building offline .upack tile packs (writer, reader, quantiser, projection math, UUIDv5 identity)"

[lints]
workspace = true

[dependencies]
# Phase 0 dependencies — uncommented as modules land:
uuid = { version = "1", default-features = false, features = ["v5"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# sha2       = { version = "0.10", default-features = false }

# Note: `slippypack-core` is intended to be `no_std + alloc` once the format
# module lands. The skeleton is plain `std` until real modules ship — that
# switch lands with the format PR, not as a separate change.
