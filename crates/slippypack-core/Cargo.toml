[package]
name = "slippypack-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared library for building offline .rawtiles tile packs (writer, reader, quantiser, projection math, UUIDv5 identity)"

[lints]
workspace = true

[dependencies]
# Phase 0 dependencies — uncommented as modules land:
uuid = { version = "1", default-features = false, features = ["v5"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pure-Rust libm: deterministic transcendental math (tan/asinh/sinh/atan)
# across native, WASM, and any future no_std target. Replaces std's
# f64::* which delegate to the platform libc's libm — works today on
# glibc/musl/macOS-libm by coincidence, breaks the moment the PWA WASM
# build hits a different libm.
libm = { version = "0.2", default-features = false }
# SHA-256 for the canonical descriptor's source `content_hash` (the
# builder hashes the pre-quantisation RGB888 stream, spec § A.4), and
# for tests/reader_conformance.rs's per-tile hashes.
sha2 = { version = "0.10", default-features = false }

# Note: `slippypack-core` is intended to be `no_std + alloc` once the format
# module lands. The skeleton is plain `std` until real modules ship — that
# switch lands with the format PR, not as a separate change.

[dev-dependencies]
