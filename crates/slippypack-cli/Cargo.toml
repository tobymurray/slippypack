[package]
name = "slippypack-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native CLI for building offline .upack tile packs"

[lints]
workspace = true

[[bin]]
name = "slippypack"
path = "src/main.rs"

[features]
# Default: raster-only path. The vector feature pulls in MapLibre Native (Phase 2)
# and requires a C++ toolchain at install time — see PLAN.md § Phase 2.
default = []
vector  = []

[dependencies]
slippypack-core = { path = "../slippypack-core" }
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Phase 1.x dependencies — uncomment as features land:
# ctrlc   = "3"

# Phase 2 dependencies (gated behind `vector`):
# maplibre_native = { version = "0.4", optional = true }
